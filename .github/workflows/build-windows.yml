name: Build Windows MSI

on:
  workflow_dispatch: # Permet de déclencher le build manuellement depuis GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Installer les dépendances NPM
        working-directory: ./DahabStock/frontend
        run: npm install

      - name: Compiler l'application Tauri (Windows MSI)
        working-directory: ./DahabStock/frontend
        run: npm run tauri build

      - name: Uploader l'installeur (Artefact)
        uses: actions/upload-artifact@v4
        with:
          name: DahabStock-Windows-Installer
          path: DahabStock/frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
